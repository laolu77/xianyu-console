# 闲鱼卖家客服自动回复配置
# 改完保存即可生效，无需重启脚本（下次轮询自动读取）。

# ===== 运行参数 =====

# 调试端口，需与启动器中的端口一致
cdp_port: 9222

# 轮询间隔（秒）。越小越及时，但 CPU 占用略高，建议不低于 2
poll_interval: 3.0

# 每小时全局最大回复数，防止失控刷屏
max_replies_per_hour: 60

# 试运行模式：true 时只打印将回复的内容，不真实发送
# 2026-10-15：链路已验证通过，关闭试运行，进入真实自动回复
dry_run: false

# 由脚本自动拉起软件（需关闭已运行的软件）。保持登录态建议用启动器，置 false
auto_start: false

# 软件路径，auto_start 为 true 时使用
app_path: ""

# ===== 关键词回复规则 =====
# 按从上到下顺序匹配，命中第一条即回复。
# keywords: 任意一个关键词命中即触发（不区分大小写）
# reply: 要自动发送的内容
# once_per_user: 同一买家对同一句话只回一次（当前实现固定生效，
# 6 小时内不重复；防止 fill 后预览变成自己的回复导致自问自答）

rules:
  - keywords: ["在吗", "在么", "有人吗", "在不在"]
    reply: "在的，请问有什么可以帮您？"

  - keywords: ["包邮", "邮费", "运费", "包快递"]
    reply: "默认包邮，偏远地区除外，需要的话可以再聊。"

  - keywords: ["什么时候发", "多久发货", "几天发货", "发货时间"]
    reply: "现货商品，付款后 48 小时内发出，发出后会同步快递单号给您。"

  - keywords: ["发货了", "单号", "快递单号", "物流"]
    reply: "稍等，我帮您查一下物流单号。"

  - keywords: ["怎么拍", "怎么下单", "如何购买", "拍了没发货"]
    reply: "直接拍下就行，付款后我会尽快安排发货。"

  - keywords: ["成色", "几成新", "用了多久", "瑕疵"]
    reply: "实物图都在商品详情里，具体成色可以看最后几张实拍图。"

  - keywords: ["能便宜", "少点", "抹零", "优惠"]
    reply: "价格已经是实价，实在想优化的话可以多拍一件，我再申请点优惠。"

  - keywords: ["在吗客服", "人工", "转人工"]
    reply: "我在的，有问题直接说就行。"

# ===== 页面元素选择器 =====
# 2026-10-15 按真实 DOM 实测校准（详见 engine.py 文档字符串）。
# 软件升级后如果检测失效，优先调整这里。

selectors:
  # 会话列表项（虚拟列表，只渲染可见窗口）
  conversation_list: "[class*='conversation-item']"
  # 未读徽章：每个会话项都有头像徽章，必须徽章内有非空文本才算未读
  unread_item: "[class*='ant-badge']"
  # 回复输入框：sendbox 内的真实 textarea
  input_box: "[class*='sendbox'] textarea"
  # 发送按钮：sendbox-bottom 内的 ant-btn（文案「发 送」）。
  # 不要写成 [class*='send']——那会先匹配到 sendbox 容器，点了等于没点
  send_button: "[class*='sendbox-bottom'] button"